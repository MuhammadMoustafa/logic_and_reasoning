# Publishes the course to GitHub Pages on every push to main.
# The repository files are the site: no build step, only the four site paths are uploaded.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Logic and content tests need no npm packages; they stop a deploy with broken links or quiz ids.
      - run: npm test
      - name: Collect the site files
        run: mkdir _site && cp -r index.html glossary.html lessons assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
